# RDMA 第十篇“LAST 丢了”的示意动画。PSN 用 n、n+1 表示，超时只给公式。
# 格子写法见 assets/kv-demo.js 开头，一格是一个请求报文。
title: 示意：8 KB WRITE 切成 FIRST（n）和 LAST（n+1）两个报文，这次丢的是 LAST。
config:
  grid_label: A 发出的请求报文（PSN）
  aria: label
  marks: {fly: 在途, lost: 丢失, resend: 重发, ok: 已写入, ack: 已确认}
  legend:
    - {swatch: used, color: A, text: 在途}
    - {swatch: cached, color: R, text: 在网络里丢失}
    - {swatch: used, color: C, text: B 已写入内存}
  rows:
    - {key: recv, name: B 期望的 PSN}
    - {key: nak, name: B 已回过 NAK}
    - {key: wire, name: B 回给 A 的报文, optional: true}
    - {key: timer, name: A 的 ACK 超时定时器, optional: true}
    - {key: retry, name: A 的 retry_cnt}
steps:
  - text: A 发出 FIRST 和 LAST，ACK 超时定时器开始计时，时长是 4.096 µs × 2^timeout。
    blocks: ["n@A:fly", "n+1@A:fly"]
    recv: [n]
    nak: 否
    timer: 计时中
    retry: RTS 时设的值
  - text: FIRST 到达 B，PSN 正好是期望值，正常写入内存，B 期望的 PSN 变成 n+1。LAST 在网络里丢了。
    blocks: ["n@C:ok", "~n+1@R:lost"]
    recv: [n+1]
    nak: 否
    timer: 计时中
    retry: RTS 时设的值
  - text: 之后再没有报文到 B。B 没有见到任何 PSN 不对的报文，不会回 NAK，两边都没有动作，A 只能等定时器到期。
    blocks: ["n@C:ok", "~n+1@R:lost"]
    recv: [n+1]
    nak: 否
    timer: 计时中，没有回应
    retry: RTS 时设的值
  - text: 定时器到期。retry_cnt 减一，A 从最早未确认的 PSN，也就是 n+1，重发 LAST。
    blocks: ["n@C:ok", "n+1@A:resend"]
    recv: [n+1]
    nak: 否
    timer: 到期
    retry: 减一
  - text: LAST 到达 B，PSN 是期望值，写入内存。B 回 ACK。
    blocks: ["n@C:ok", "n+1@C:ok"]
    recv: [n+2]
    nak: 否
    wire: [ACK@C]
    retry: 减一
  - text: A 收到 ACK，两个报文都确认了，retry_cnt 恢复。如果丢的是这个 ACK，结果一样：A 等到超时后重发 LAST，B 收到的是 PSN 比期望值小的重复报文，不再写一次，只是再回一次 ACK。
    blocks: ["n@C:ack", "n+1@C:ack"]
    recv: [n+2]
    nak: 否
    retry: 恢复成 RTS 时设的值
