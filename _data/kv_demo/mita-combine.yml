# MiTA 解读稿的示意数据，演示共享专家和路由专家拆开计算后用 online softmax 合并。
title: 共享专家（4 对摘要）与路由专家（3 对原始 KV）分两次 FlashAttention 独立计算，再经 online softmax 精确合并（示意数据）。
config:
  grids:
  - key: row
    label: t9 对应的 7 对 key-value
    columns: 7
    mobile_columns: 4
  legend:
  - color: S
    text: 共享专家
  - color: B
    text: 路由专家 1
  - dim: true
    text: 这一步不参与
  rows:
  - key: part
    name: 两侧中间结果
steps:
- text: 实现时不必把 7 对 KV 真正拼成一张张量：共享专家单独跑一次常规 FlashAttention，路由专家按分组跑一次变长 FlashAttention。
  row:
  - q̃0@S
  - q̃1@S
  - q̃2@S
  - q̃3@S
  - t7@B
  - t3@B
  - t9@B
  part:
  - 共享专家：4 对@S
  - 专家 1：3 对@B
- text: 共享专家一侧：4 个注意力分数最大值为 1.45，减最大值后的指数和为 1.81，局部 softmax 加权输出为 3.49。
  row:
  - q̃0@S:0.3
  - q̃1@S:1.5
  - q̃2@S:0.7
  - q̃3@S:-1.7
  - -t7@B:2.5
  - -t3@B:2.2
  - -t9@B:2.4
  part:
  - 最大值 1.45，指数和 1.81，输出 3.49@S
- text: 路由专家一侧：专家 1 里 3 个分数最大值为 2.55，指数和为 2.56，局部输出为 5.11。
  row:
  - -q̃0@S:0.3
  - -q̃1@S:1.5
  - -q̃2@S:0.7
  - -q̃3@S:-1.7
  - t7@B:2.5
  - t3@B:2.2
  - t9@B:2.4
  part:
  - 最大值 1.45，指数和 1.81，输出 3.49@S
  - 最大值 2.55，指数和 2.56，输出 5.11@B
- text: online softmax 合并：取两侧最大值中的较大者 2.55，将共享专家的指数和乘上 exp(1.45 − 2.55) 换算到同一基准，得到 0.61 与 2.56，对应两侧权重占比 19% 和 81%。
  row:
  - q̃0@S:3%|0.104
  - q̃1@S:11%|0.335
  - q̃2@S:5%|0.151
  - q̃3@S:0%|0.015
  - t7@B:32%|1.000
  - t3@B:23%|0.712
  - t9@B:27%|0.844
  part:
  - 共享专家占比 19%@S
  - 专家 1 占比 81%@B
- text: 按 19% 和 81% 加权合并两侧局部输出，得到最终结果 4.80，与把 7 对 KV 直接拼在一起做一次全局 softmax 的结果完全相等。
  row:
  - q̃0@S:v=2.48|0.104
  - q̃1@S:v=3.84|0.335
  - q̃2@S:v=3.53|0.151
  - q̃3@S:v=2.40|0.015
  - t7@B:v=5.00|1.000
  - t3@B:v=4.70|0.712
  - t9@B:v=5.60|0.844
  part:
  - 合并输出 4.80
