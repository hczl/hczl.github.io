# 第五篇 block table 的示意动画。数字是示意，不是实测，实测的对应关系写在每一步的文字里。
# 格子写法见 assets/kv-demo.js 开头。格子按物理位置排，左上角是物理 block 号，
# 格内是这个 block 在请求里的逻辑编号；A 是第 2 轮请求，B 是开头和它相同的另一条请求。
title: 示意：KV Cache 只有 12 个物理 block，第 2 轮请求 A 命中 3 个、每块 prefill 分配 2 个，数字按比例缩小了。实测是命中 18 个、每块 128 个，见每一步的文字。
config:
  grid_label: 物理 block（左上角是物理编号，格内是逻辑编号）
  index: true
  marks: {new: 新分配, share: 共用}
  legend:
    - {swatch: used, color: A, text: 请求 A（第 2 轮）}
    - {swatch: used, color: B, text: 请求 B}
    - {swatch: cached, color: A, text: 空闲，还挂着哈希，可被命中}
    - {swatch: empty, text: 空闲}
  rows:
    - {key: ta, name: A 的 block table}
    - {key: tb, name: B 的 block table, optional: true}
steps:
  - text: A 到达之前，第 1 轮留下的 3 个写满的 block 还挂着哈希，散在物理位置 5、1、9。A 的 block table 还是空的。
    blocks: [".", "~1@A", ".", ".", ".", "~0@A", ".", ".", ".", "~2@A", ".", "."]
    ta: []
  - text: 查前缀缓存，A 的前 3 个 block 和第 1 轮的内容相同，直接用，把物理编号 5、1、9 依次填进表的第 0～2 项。实测是前 18 个 block，288 个 token。
    blocks: [".", "1@A:hit", ".", ".", ".", "0@A:hit", ".", ".", ".", "2@A:hit", ".", "."]
    ta: [5@A, 1@A, 9@A]
  - text: 第一块 prefill 只为这一块要算的 token 取空闲 block，取到的是 7 和 2，追加到表的第 3、4 项。物理上不相邻也没关系。实测每块 2048 个 token，取 128 个 block。
    blocks: [".", "1@A", "4@A:new", ".", ".", "0@A", ".", "3@A:new", ".", "2@A", ".", "."]
    ta: [5@A, 1@A, 9@A, 7@A, 2@A]
  - text: 第二块再取 2 个，是 10 和 0。表越来越长，物理位置越来越散。
    blocks: ["6@A:new", "1@A", "4@A", ".", ".", "0@A", ".", "3@A", ".", "2@A", "5@A:new", "."]
    ta: [5@A, 1@A, 9@A, 7@A, 2@A, 10@A, 0@A]
  - text: 第三块取 4 和 11。
    blocks: ["6@A", "1@A", "4@A", ".", "7@A:new", "0@A", ".", "3@A", ".", "2@A", "5@A", "8@A:new"]
    ta: [5@A, 1@A, 9@A, 7@A, 2@A, 10@A, 0@A, 4@A, 11@A]
  - text: 最后一块只剩几个 token，取 1 个 block，放在物理位置 6，只写了 3 格（16 格里的 3 格）。实测最后一块 787 个 token，取 50 个 block，prefill 结束时表有 452 项，最后一个 block 也是只有 3 个 token。
    blocks: ["6@A", "1@A", "4@A", ".", "7@A", "0@A", "9@A:3/16", "3@A", ".", "2@A", "5@A", "8@A"]
    ta: [5@A, 1@A, 9@A, 7@A, 2@A, 10@A, 0@A, 4@A, 11@A, 6@A]
  - text: decode 的第一个 token 写进最后一个 block 里紧接着的一格（从 0 数第 3 格），不需要新 block，表不变。实测是位置 7219 的 token 写进第 451 个逻辑 block 的第 3 格。
    blocks: ["6@A", "1@A", "4@A", ".", "7@A", "0@A", "9@A:4/16", "3@A", ".", "2@A", "5@A", "8@A"]
    ta: [5@A, 1@A, 9@A, 7@A, 2@A, 10@A, 0@A, 4@A, 11@A, 6@A]
  - text: 之后每步写一格。这个 block 写满后，下一个 token 才取一个新 block（物理位置 3），追加到表的末尾。实测这一轮输出 45 个 token，decode 期间一共新分配了 2 个，最后是 454 项。
    blocks: ["6@A", "1@A", "4@A", "10@A:1/16", "7@A", "0@A", "9@A:16/16", "3@A", ".", "2@A", "5@A", "8@A"]
    ta: [5@A, 1@A, 9@A, 7@A, 2@A, 10@A, 0@A, 4@A, 11@A, 6@A, 3@A]
  - text: 另一条请求 B 到达，开头和 A 相同，前 2 个 block 命中，B 的表第 0、1 项填的就是 A 用着的 5 和 1，同一组物理 block 被两张表引用。B 自己的内容从第 2 项起不同，取新 block 8。实测是第四篇第 36 步会话 0 第 2 轮和会话 1 第 1 轮共用 system prompt 的 17 个 block。
    blocks: ["6@A", "1@A:share", "4@A", "10@A", "7@A", "0@A:share", "9@A", "3@A", "2@B:new", "2@A", "5@A", "8@A"]
    ta: [5@A, 1@A, 9@A, 7@A, 2@A, 10@A, 0@A, 4@A, 11@A, 6@A, 3@A]
    tb: [5@A, 1@A, 8@B]
  - text: A 结束，表里的 block 都不再被 A 引用。写满的保留内容和哈希，下一轮还能命中；没写满的最后一个回到空闲。5 和 1 还被 B 引用，不会空出来。
    blocks: ["~6@A", "1@B", "~4@A", ".", "~7@A", "0@B", "~9@A", "~3@A", "2@B", "~2@A", "~5@A", "~8@A"]
    ta: 请求已结束
    tb: [5@B, 1@B, 8@B]
