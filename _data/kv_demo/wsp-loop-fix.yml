# MIT Weight-Space Programming 实验 8：Qwen3.5-0.8B 改权重前后在 1,152 道独立保留练习题上的结局分布。
# 数字逐项取自公开日志仓库 exp8_math 最终提交报告（122 + 7 + 1023 = 1152；696 + 245 + 211 = 1152）。
title: 1,152 道保留练习题（GSM8K 与 MATH 各 576 题）上，改掉 0.016% 权重前后的回答结局对比。
config:
  scale: 1152
  digits: 0
  min_pct: 2.5
  unit: 题
  axis: ["0", "共 1,152 道题"]
  rest_label: 未统计
  bars:
    - {key: orig, name: 原始权重}
    - {key: edit, name: 改完第 15、19 层各 64 列后}
  legend:
    - {color: C, text: 答对}
    - {color: G, text: 正常结束但答错或漏写答案框}
    - {color: R, text: 重复思考直到 32,768 token 上限被截断}
steps:
  - text: 先看原始权重：1,152 道题里只答对 122 题（10.6%），正常答完却算错或漏答的只有 7 题（0.6%），剩下 1,023 题（88.8%）一直重复思考直到撞上 32,768 token 上限。
    bars:
      orig:
        name: 原始权重（准确率 10.6%）
        segs: [[答对, 122, C], [答完未对, 7, G], [截断失败, 1023, R]]
        note: 1,023 题卡死在长度上限
        bad: true
      edit:
        name: 改完第 15、19 层各 64 列后（待对比）
        segs: [[答对, 122, C], [答完未对, 7, G], [截断失败, 1023, R]]
        dim: true
  - text: 50 次前向预算改完 131,072 个权重后，用相同随机种子重跑这 1,152 道题：截断失败从 1,023 题降到 211 题，答对从 122 题升到 696 题（60.4%），准确率提高 49.8 个百分点。
    bars:
      orig:
        name: 原始权重（准确率 10.6%）
        segs: [[答对, 122, C], [答完未对, 7, G], [截断失败, 1023, R]]
      edit:
        name: 改完 131,072 个权重后（准确率 60.4%）
        segs: [[答对, 696, C], [答完未对, 245, G], [截断失败, 211, R]]
        note: 救回 579 题，仅 5 题由对变错
  - text: 救回来的 579 道题里，有 576 道原本都是撞上长度上限的截断题；与此同时，正常结束却算错或漏框的题也从 7 题变成 245 题。所有 696 道答对的题都正常关掉了思考标签，回答中位长度 9,172 个 token，说明改动只是解开了死循环，既没有强行提前结束思考，也没有凭空增加数学知识。
    bars:
      orig:
        name: 原始权重（正确回答中位长度 5,311 token）
        segs: [[答对, 122, C], [答完未对, 7, G], [截断失败, 1023, R]]
      edit:
        name: 改完 131,072 个权重后（正确回答中位长度 9,172 token）
        segs: [[答对, 696, C], [答完未对, 245, G], [截断失败, 211, R]]
        note: 576 / 579 来自原本截断的题
