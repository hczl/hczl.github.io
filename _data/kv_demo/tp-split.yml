# 第九篇开头的缩小例子：同一个模型放在一张卡上和用 TP=2 放在两张卡上，每张卡的显存怎么分、能放几个 block。
# 数字是示意，大致按实测比例取整：单卡 3 个 block，TP=2 是 14 个，和实测一样是 4.7 倍。格子写法见 assets/kv-demo.js 开头（grids）。
title: 示意：每张卡的显存画成 24 格，单卡时权重占 16 格，其他占 2 格，一个 block 占 2 格。格数大致按实测比例取整，实测见每一步的文字。
config:
  grids:
    - {key: g0, label: 卡 0, aria_name: 卡 0, columns: 8}
    - {key: g1, label: 卡 1, aria_name: 卡 1, columns: 8}
  legend:
    - {swatch: used, color: G, text: 权重}
    - {swatch: used, color: S, text: 其他（预留、激活、CUDA Graph）}
    - {swatch: used, color: A, text: 请求 A 的 block，格内是 block 编号}
    - {swatch: used, color: B, text: 请求 B}
    - {swatch: used, color: C, text: 请求 C}
    - {swatch: used, color: D, text: 请求 D}
    - {swatch: empty, text: 空着，可以放 KV}
  rows:
    - {key: running, name: 运行队列}
    - {key: waiting, name: 等待队列}
    - {key: note, name: 这一步, optional: true}
steps:
  - text: 单卡。卡 0 的 24 格里，权重占 16 格，预留和激活等其他用途占 2 格，剩下 6 格放 KV。一个 block 存 16 个 token 在所有层的 K 和 V，占 2 格，所以只有 3 个 block。卡 1 没用上。实测单卡权重 15.27 GiB，KV 5.48 GiB，2,495 个 block。
    grid_labels: {g0: 卡 0（单卡）, g1: 卡 1（没用上）}
    g0: [权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 其他@S, 其他@S, ".", ".", ".", ".", ".", "."]
    g1: [".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", "."]
    running: []
    waiting: []
  - text: 请求 A 的 prompt 要 2 个 block，占掉 4 格。请求 B 也要 2 个 block，只剩 1 个，进不来，在等待队列里等 A 结束。
    grid_labels: {g0: 卡 0（单卡）, g1: 卡 1（没用上）}
    g0: [权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 其他@S, 其他@S, 0@A, 0@A, 1@A, 1@A, ".", "."]
    g1: [".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", "."]
    running: [A]
    waiting: [B]
  - text: 换成两张卡，用 TP=2 重新启动。每张卡只放一半权重，8 格，其他用途还是 2 格，空出来的格子都给了 KV，每张卡有 14 格，是单卡的 2.3 倍。实测每张卡的权重从 15.27 GiB 降到 7.64 GiB，KV 从 5.48 GiB 涨到 12.97 GiB，是 2.37 倍。
    grid_labels: {g0: 卡 0（TP=2）, g1: 卡 1（TP=2）}
    g0: [权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 其他@S, 其他@S, ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", "."]
    g1: [权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 其他@S, 其他@S, ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", "."]
    running: []
    waiting: []
  - text: TP=2 时每层的 KV 头分到两张卡上，每张卡只存一半的头，所以一个 block 在每张卡上只占 1 格，是单卡时的一半，14 格就是 14 个 block，是单卡 3 个的 4.7 倍。调度器还是只有一个，block 编号也只有一套：A 分到 block 0、1，B 分到 2、3，两张卡都用这几个编号，各存自己那一半头的 K 和 V。实测 Qwen3-8B 每层 8 个 KV 头，每张卡存 4 个，一个 block 从 2.25 MiB 变成每张卡 1.125 MiB；block 数从 2,495 涨到 11,807，也是 4.7 倍。
    grid_labels: {g0: 卡 0（TP=2）, g1: 卡 1（TP=2）}
    g0: [权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 其他@S, 其他@S, 0@A, 1@A, 2@B, 3@B, ".", ".", ".", ".", ".", ".", ".", ".", ".", "."]
    g1: [权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 其他@S, 其他@S, 0@A, 1@A, 2@B, 3@B, ".", ".", ".", ".", ".", ".", ".", ".", ".", "."]
    running: [A, B]
    waiting: []
  - text: 每一步两张卡同时算同一批 token，各用自己那一半的头和权重。每层的 attention 和 MLP 算完，两张卡手里各是一份部分结果，要做一次 all-reduce 把两份加起来，两张卡拿到同样的结果，再往下算。实测每层 2 次，加上 embedding 之后的 1 次，一步 73 次。多了这些通信，但每张卡只读一半的权重。
    grid_labels: {g0: 卡 0（TP=2）, g1: 卡 1（TP=2）}
    g0: [权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 其他@S, 其他@S, 0@A, 1@A, 2@B, 3@B, ".", ".", ".", ".", ".", ".", ".", ".", ".", "."]
    g1: [权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 其他@S, 其他@S, 0@A, 1@A, 2@B, 3@B, ".", ".", ".", ".", ".", ".", ".", ".", ".", "."]
    running: [A, B]
    waiting: []
    note: 两张卡各算一半 → all-reduce → 各算一半 → all-reduce → …
  - text: 又来了 C 和 D，各要 3 个 block，也都放得下，4 条请求一起跑，14 个 block 用了 10 个，还空着 4 个。单卡时只能先跑 A 一条。实测 64 条请求同时来，单卡同时跑的最多 21 条，抢占 6 次；TP=2 时 64 条全在跑，KV 只用了 69%。
    grid_labels: {g0: 卡 0（TP=2）, g1: 卡 1（TP=2）}
    g0: [权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 其他@S, 其他@S, 0@A, 1@A, 2@B, 3@B, 4@C, 5@C, 6@C, 7@D, 8@D, 9@D, ".", ".", ".", "."]
    g1: [权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 权重@G, 其他@S, 其他@S, 0@A, 1@A, 2@B, 3@B, 4@C, 5@C, 6@C, 7@D, 8@D, 9@D, ".", ".", ".", "."]
    running: [A, B, C, D]
    waiting: []
