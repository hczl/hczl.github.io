# 扩散式语言模型稿的示意数据。置信度来自正文第五步的小语料，由理想预测器算出。
title: 低置信度重遮生成“我 喜欢 喝 茶”，每步定下一个词。
config:
  grids:
  - key: seq
    label: 回答的 4 个位置
    columns: 4
    mobile_columns: 4
    aria_name: 位置
  legend:
  - color: B
    text: 这一步的预测，小字和细条是置信度
  - pick: true
    text: 这一步保留的位置
  - color: A
    text: 已定下
  - color: G
    text: "[M]"
  rows:
  - key: done
    name: 已定下
steps:
- text: 生成开始，4 个位置全是 [M]。
  seq: ["[M]@G", "[M]@G", "[M]@G", "[M]@G"]
  done: []
- text: 第 1 步，一次前向预测全部 4 个位置。“喝”的置信度最高，是 0.70，因为 10 句里有 7 句是“喝”。
  seq: ["我@B:0.60|0.60", "喜欢@B:0.60|0.60", "!喝@B:0.70|0.70", "茶@B:0.40|0.40"]
  done: []
- text: 保留“喝”，其余 3 个位置遮回 [M]。
  seq: ["[M]@G", "[M]@G", "喝@A", "[M]@G"]
  done: ["喝@A"]
- text: 第 2 步，“喝”已经看得到，句子只可能是前 3 种。“我”和“喜欢”的置信度都升到 0.86，按位置顺序保留“我”。
  seq: ["!我@B:0.86|0.86", "喜欢@B:0.86|0.86", "喝@A", "茶@B:0.57|0.57"]
  done: ["喝@A"]
- text: 保留“我”，第 2、4 个位置遮回 [M]。
  seq: ["我@A", "[M]@G", "喝@A", "[M]@G"]
  done: ["喝@A", "我@A"]
- text: 第 3 步，有了“我”，第二个位置只能是“喜欢”，置信度 1.00。
  seq: ["我@A", "!喜欢@B:1.00|1", "喝@A", "茶@B:0.67|0.67"]
  done: ["喝@A", "我@A"]
- text: 保留“喜欢”。
  seq: ["我@A", "喜欢@A", "喝@A", "[M]@G"]
  done: ["喝@A", "我@A", "喜欢@A"]
- text: 第 4 步，只剩最后一个位置，“茶”的置信度是 0.67，另外 0.33 是“咖啡”。
  seq: ["我@A", "喜欢@A", "喝@A", "!茶@B:0.67|0.67"]
  done: ["喝@A", "我@A", "喜欢@A"]
- text: 4 步定下 4 个词，顺序是第 3、1、2、4 个位置，不是从左到右。
  seq: ["我@A", "喜欢@A", "喝@A", "茶@A"]
  done: ["喝@A", "我@A", "喜欢@A", "茶@A"]
