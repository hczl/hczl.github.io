# 3Blue1Brown 风格二维线性变换与特征向量连续网格动画。
title: 观察二维网格从恒等变换连续过渡到目标矩阵：虚线标出向量原本所在的直线（span），拖动金色圆点可任意旋转探测向量 x，亲自寻找留在原直线上的特征方向。
config:
  mode: eigen2d
  hint: 拖动画面中的金色向量圆点可测试任意方向
  scrub_label: 变换进度 t
  legend:
    - {hex: "#fbbf24", text: "可拖动探测向量 x 及其变换后位置"}
    - {hex: "#fbbf24", dashed: true, text: "x 原本所在的直线"}
    - {hex: "#60a5fa", text: "第一特征方向"}
    - {hex: "#34d399", text: "第二特征方向"}
steps:
  - text: 变换前（t = 0）：青色坐标网格与灰色参考网格重合，所有单位向量的终点落在单位圆上。虚线分别标出探测向量 x（金色，默认指向 [1, 0]ᵀ）以及两条 45° 对角方向 q₁、q₂ 各自所在的直线。
    mat: [2, 1, 1, 2]
    mat_label: A
    t: 0
    probe_deg: 0
    eigens:
      - [0.70710678, 0.70710678, 3, "q₁ (λ=3)", "#60a5fa"]
      - [0.70710678, -0.70710678, 1, "q₂ (λ=1)", "#34d399"]
  - text: 施加实对称矩阵 A = [[2, 1], [1, 2]]（点击“下一步”或拖动滑块观察连续变形）：单位圆被拉成斜向椭圆，非特征方向上的探测向量 x 会偏离原来的金色虚线（如默认的 [1, 0]ᵀ 变到 [2, 1]ᵀ）；唯独蓝色 q₁ 始终沿 45° 虚线拉长到 3 倍，绿色 q₂ 留在 −45° 虚线上保持不变。你拖过的 x 角度在后续步骤中会一直保留。
    mat: [2, 1, 1, 2]
    mat_label: A
    t: 1
    probe_deg: 0
    eigens:
      - [0.70710678, 0.70710678, 3, "Aq₁ = 3q₁", "#60a5fa"]
      - [0.70710678, -0.70710678, 1, "Aq₂ = q₂", "#34d399"]
  - text: 按正交特征基拆解任意向量：把 x 投影到 q₁ 和 q₂ 两条互相垂直的特征轴上（平行四边形虚线），经过 A 变换只是把两段分量各自乘上 λ₁ = 3 与 λ₂ = 1 再首尾相加。拖动滑块来回看 t 从 0 到 1，两段分量始终严格保持正交。
    mat: [2, 1, 1, 2]
    mat_label: A
    t: 1
    probe_deg: 0
    decompose: true
    eigens:
      - [0.70710678, 0.70710678, 3, "Aq₁ = 3q₁", "#60a5fa"]
      - [0.70710678, -0.70710678, 1, "Aq₂ = q₂", "#34d399"]
  - text: 换成非对称上三角矩阵 B = [[2, 1], [0, 3]]：仍然存在两条留在原直线上的特征方向 s₁ = [1, 0]ᵀ（拉长 2 倍）与 s₂ = [1, 1]ᵀ/√2（拉长 3 倍），所以 B 依然可以对角化；但这两条直线夹角只有 45°，不再互相垂直。
    mat: [2, 1, 0, 3]
    mat_label: B
    t: 1
    probe_deg: 110
    eigens:
      - [1, 0, 2, "Bs₁ = 2s₁", "#60a5fa"]
      - [0.70710678, 0.70710678, 3, "Bs₂ = 3s₂", "#34d399"]
  - text: 换成水平剪切矩阵 J = [[1, 1], [0, 1]]：纵轴方向发生倾斜，平面上除横轴外的所有直线都被推歪，只剩横轴这一条特征方向（λ = 1），凑不够两个线性无关的特征向量，因此 J 无法对角化。
    mat: [1, 1, 0, 1]
    mat_label: J
    t: 1
    probe_deg: 65
    eigens:
      - [1, 0, 1, "唯一特征方向 (λ=1)", "#60a5fa"]
  - text: 换成逆时针旋转 90° 的矩阵 [[0, −1], [1, 0]]：整个网格刚体旋转 90°，没有任何一个非零实向量能留在原来的直线上，对应特征方程 λ² + 1 = 0 没有实根（特征值为 ±i）。
    mat: [0, -1, 1, 0]
    mat_label: R
    rot90: true
    t: 1
    probe_deg: 25
    eigens: []
  - text: 通往下一节 SVD 的伏笔：再看刚才不可对角化的剪切矩阵 J = [[1, 1], [0, 1]]，虽然它只有一条特征直线，但单位圆变过去依然是个规整椭圆。在输入圆上总能找到一对互相垂直的方向 v₁ ⊥ v₂（原点标有直角符号），经 J 变换后同时旋转并伸缩为椭圆互相垂直的长短半轴 1.62u₁ ⊥ 0.62u₂；只要放宽条件，不再要求输入和输出留在同一条直线上，就自然接上了下一节的奇异值分解。
    mat: [1, 1, 0, 1]
    mat_label: J
    t: 1
    probe_deg: 65
    eigens: []
    svd_axes:
      - [0.52573111, 0.85065081, "Jv₁ = 1.62u₁", "#60a5fa"]
      - [-0.85065081, 0.52573111, "Jv₂ = 0.62u₂", "#34d399"]
