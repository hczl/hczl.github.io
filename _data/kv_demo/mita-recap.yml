# MiTA 解读稿的示意数据，演示 4×4 小图上 t9 走完一层 MiTA 注意力的完整过程。
title: 4×4 小图（16 个 token，m = 4，k = 3，s = 1）上，查询 t9（带圈格）怎样从 16 对原始 KV 收窄到 4 对摘要加 3 对原始 KV。
config:
  grids:
  - key: img
    label: 4×4 的小图，16 个 token（t0～t15）
    columns: 4
    aria_name: 小图
  legend:
  - ring: true
    text: 当前跟踪的 query（t9）
  - dim: true
    text: 这一步用不到
  - color: S
    text: 压缩出的全局摘要
  rows:
  - key: see
    name: t9 访问的 KV
steps:
- text: 起点：在标准双向注意力里，位于鸟身上的 t9 要和整张图里全部 16 个 token 的 key-value 做注意力计算。
  img:
  - t0@A:天空
  - t1@A:天空
  - t2@A:天空
  - t3@A:鸟
  - t4@A:天空
  - t5@A:鸟
  - t6@A:鸟
  - t7@A:鸟
  - t8@A:树枝
  - '*t9@A:鸟'
  - t10@A:树枝
  - t11@A:叶子
  - t12@A:树枝
  - t13@A:树枝
  - t14@A:叶子
  - t15@A:叶子
  see: 全部 16 对原始 KV
- text: 池化生成 landmark query：将 16 个 query 排回 4×4 网格，按 2×2 划成 4 个窗口分别取均值，得到 4 个代表向量 q̃0～q̃3。
  img:
  - t0@A:窗口 0
  - t1@A:窗口 0
  - t2@B:窗口 1
  - t3@B:窗口 1
  - t4@A:窗口 0
  - t5@A:窗口 0
  - t6@B:窗口 1
  - t7@B:窗口 1
  - t8@C:窗口 2
  - '*t9@C:窗口 2'
  - t10@D:窗口 3
  - t11@D:窗口 3
  - t12@C:窗口 2
  - t13@C:窗口 2
  - t14@D:窗口 3
  - t15@D:窗口 3
  see: 尚未开始注意力计算
- text: 组建动态 top-k 专家：每个 landmark query 对全部 16 个 key 打分并取前 3 名，组成一个专家。q̃1 跨出窗口 1 挑中了窗口 2 里的 t9（专家 1 为 t7、t3、t9）；不同专家可重叠选中同一个 token（例如 t10 同时进入专家 2 和专家 3），没被任何专家选中的 6 个背景格不再参与路由分支。
  img:
  - t0@A:专家 0
  - -t1
  - t2@A:专家 0
  - t3@B:专家 1
  - t4@A:专家 0
  - -t5
  - -t6
  - t7@B:专家 1
  - -t8
  - '*t9@B:专家 1'
  - t10@C:专家 2/3
  - t11@D:专家 3
  - t12@C:专家 2
  - t13@C:专家 2
  - t14@D:专家 3
  - -t15
  see: 尚未开始注意力计算
- text: 压缩出共享专家：用上一步的打分对全部 16 个 value 做 softmax 加权求和，得到 4 个 landmark value，与 q̃0～q̃3 配对构成全局摘要，供所有 query 共享。
  img:
  - t0@S
  - t1@S
  - t2@S
  - t3@S
  - t4@S
  - t5@S
  - t6@S
  - t7@S
  - t8@S
  - '*t9@S'
  - t10@S
  - t11@S
  - t12@S
  - t13@S
  - t14@S
  - t15@S
  see:
  - 摘要 q̃0→ṽ0@S
  - 摘要 q̃1→ṽ1@S
  - 摘要 q̃2→ṽ2@S
  - 摘要 q̃3→ṽ3@S
- text: 稀疏路由：t9 与 4 个 landmark query 做点积，和代表鸟部特征的 q̃1 得分最高，因而虽然位置在窗口 2，仍被路由给专家 1（t7、t3、t9）。
  img:
  - -t0
  - -t1
  - -t2
  - t3@A:专家 1
  - -t4
  - -t5
  - -t6
  - t7@A:专家 1
  - -t8
  - '*t9@A:专家 1'
  - -t10
  - -t11
  - -t12
  - -t13
  - -t14
  - -t15
  see:
  - 摘要 q̃0→ṽ0@S
  - 摘要 q̃1→ṽ1@S
  - 摘要 q̃2→ṽ2@S
  - 摘要 q̃3→ṽ3@S
  - 专家 1：t7、t3、t9@A
- text: 最终注意力范围：t9 只需对 7 对 KV 做注意力计算，包括 4 对全局摘要和专家 1 里的 3 对鸟部原始 KV，相比标准注意力的 16 对少看了一半以上。
  img:
  - -t0
  - -t1
  - -t2
  - t3@A:原始 KV
  - -t4
  - -t5
  - -t6
  - t7@A:原始 KV
  - -t8
  - '*t9@A:原始 KV'
  - -t10
  - -t11
  - -t12
  - -t13
  - -t14
  - -t15
  see:
  - 摘要 q̃0→ṽ0@S
  - 摘要 q̃1→ṽ1@S
  - 摘要 q̃2→ṽ2@S
  - 摘要 q̃3→ṽ3@S
  - t7@A
  - t3@A
  - t9@A
