# 第十篇：block 从 16 个 token 变成 128 个 token，前缀缓存的命中粒度跟着变粗。
# 示意图里一格 = 8 个 token，所以 4090 的一个 block 是 2 格，910B1 的一个 block 是 16 格，比例和实测一致。
# 对应的实测数字写在每一步的文字里。格子写法见 assets/kv-demo.js 开头（grids）。
title: 示意：一格 8 个 token。同一段 248 个 token 的 prompt（31 格），上一轮已经算过，这一轮看两种 block 大小各能命中多少。
config:
  grids:
    - {key: g0, label: "RTX 4090：block = 16 个 token = 2 格", aria_name: 4090, columns: 16}
    - {key: g1, label: "Ascend 910B1：block = 128 个 token = 16 格", aria_name: 910B1, columns: 16}
  legend:
    - {swatch: used, color: A, text: 命中前缀缓存的 block，格内是 block 编号}
    - {swatch: used, color: R, text: 这一轮要重新算的 token}
    - {swatch: empty, text: 不在这段 prompt 里}
  rows:
    - {key: hit, name: 命中}
    - {key: redo, name: 重算}
    - {key: note, name: 这一步, optional: true}
steps:
  - text: 同一段 prompt 占 31 格，也就是 248 个 token。它和上一轮请求的开头完全一样，KV 还在显存里，理想情况是一个 token 都不用重算。但缓存是按 block 存的，不满一个 block 的尾巴存不进去，所以能命中多少取决于 block 有多大。
    g0: [".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", "."]
    g1: [".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", "."]
    hit: []
    redo: []
  - text: 4090 上一个 block 是 16 个 token，画成 2 格。248 个 token 里前 240 个正好凑满 15 个 block，全部命中；剩下 8 个 token 不满一块，这一轮重新算。
    g0: [0@A, 0@A, 1@A, 1@A, 2@A, 2@A, 3@A, 3@A, 4@A, 4@A, 5@A, 5@A, 6@A, 6@A, 7@A, 7@A, 8@A, 8@A, 9@A, 9@A, 10@A, 10@A, 11@A, 11@A, 12@A, 12@A, 13@A, 13@A, 14@A, 14@A, 重算@R, "."]
    g1: [".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", ".", "."]
    hit: ["4090：240 个 token@A"]
    redo: ["4090：8 个 token@R"]
  - text: 910B1 上一个 block 是 128 个 token，画成 16 格。248 个 token 只凑得满 1 个 block，命中 128 个；后面 120 个 token 虽然内容一模一样，也得重新算一遍。block 变大 8 倍，尾巴上浪费的也跟着变大。
    g0: [0@A, 0@A, 1@A, 1@A, 2@A, 2@A, 3@A, 3@A, 4@A, 4@A, 5@A, 5@A, 6@A, 6@A, 7@A, 7@A, 8@A, 8@A, 9@A, 9@A, 10@A, 10@A, 11@A, 11@A, 12@A, 12@A, 13@A, 13@A, 14@A, 14@A, 重算@R, "."]
    g1: [0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, "."]
    hit: ["4090：240 个 token@A", "910B1：128 个 token@A"]
    redo: ["4090：8 个 token@R", "910B1：120 个 token@R"]
    note: block 越大，尾巴上没能缓存的部分越多
  - text: 实测也是这样。同一段 6 轮对话，第二轮的 prompt 是 7,219 个 token，4090 命中 7,200（16 的倍数），910B1 命中 7,168（128 的倍数）。prompt 越长，这点差距占的比例越小：第四轮 15,536 个 token 时，4090 命中 15,408，910B1 命中 15,360，差 48 个 token。
    g0: [0@A, 0@A, 1@A, 1@A, 2@A, 2@A, 3@A, 3@A, 4@A, 4@A, 5@A, 5@A, 6@A, 6@A, 7@A, 7@A, 8@A, 8@A, 9@A, 9@A, 10@A, 10@A, 11@A, 11@A, 12@A, 12@A, 13@A, 13@A, 14@A, 14@A, 重算@R, "."]
    g1: [0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 0@A, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, 重算@R, "."]
    hit: ["实测第二轮：4090 命中 7,200@A", "910B1 命中 7,168@A"]
    redo: ["4090 重算 19 个@R", "910B1 重算 51 个@R"]
    note: 另外，不管 block 多大，最后一个 token 永远要重新算一次
