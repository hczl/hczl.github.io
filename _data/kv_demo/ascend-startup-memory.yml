# 第十篇开头的例子：同一条启动命令，一张 RTX 4090 和一张 Ascend 910B1，显存怎么分。
# 数字都是实测，出自两边启动日志里的那行显存明细，单位 GiB。写法见 assets/bar-demo.js 开头。
title: 同一个模型、同一条命令，在两种卡上把显存一项项分出去。两根条按同一个比例尺画，整根是各自的整卡容量，虚线是 0.92 的预算。
config:
  scale: 60.96
  digits: 2
  unit: GiB
  min_pct: 0.6
  axis: ["0", "910B1 整卡 60.96 GiB"]
  rest_label: 这张卡上还没分出去的
  outside_label: 这张卡没有的显存
  bars:
    - {key: gpu, name: RTX 4090（整卡 23.52）}
    - {key: npu, name: Ascend 910B1（整卡 60.96）}
  legend:
    - {color: A, text: 权重（含不归框架管的那部分）}
    - {color: B, text: 跑一次前向时的显存峰值增量}
    - {color: C, text: KV Cache}
    - {color: D, style: hatch, text: 图捕获，划完 KV 之后才占}
  rows:
    - {key: cap, name: KV 容量}
steps:
  - text: 两张卡都按默认的 --gpu-memory-utilization 0.92 算预算：4090 是 23.52 × 0.92 = 21.64 GiB，910B1 是 60.96 × 0.92 = 56.08 GiB，也就是虚线的位置。引擎后面所有的显存都从预算里出。
    bars:
      gpu: {cap: 23.52, segs: [], mark: [21.64, 0.92 的预算 21.64]}
      npu: {cap: 60.96, segs: [], mark: [56.08, 0.92 的预算 56.08]}
    cap: 还没算
  - text: 加载权重。同一份 Qwen3-8B bf16，两边几乎一样：4090 是 15.54 GiB（含 0.27 GiB 不归 PyTorch 管的部分），910B1 是 15.29 加 0.03。权重不会因为卡大就变大，这一段在两根条上一样长。
    bars:
      gpu: {cap: 23.52, segs: [[权重, 15.54, A]], mark: [21.64, 0.92 的预算 21.64]}
      npu: {cap: 60.96, segs: [[权重, 15.32, A]], mark: [56.08, 0.92 的预算 56.08]}
    cap: 还没算
  - text: 用假数据跑一次前向，记下显存峰值的增量：4090 是 0.62 GiB，910B1 是 0.2 GiB。这部分和卡的大小也基本无关。
    bars:
      gpu: {cap: 23.52, segs: [[权重, 15.54, A], [峰值增量, 0.62, B]], mark: [21.64, 0.92 的预算 21.64]}
      npu: {cap: 60.96, segs: [[权重, 15.32, A], [峰值增量, 0.2, B]], mark: [56.08, 0.92 的预算 56.08]}
    cap: 还没算
  - text: 预算里剩下的全给 KV Cache，也就是从前面两段的末尾一直填到虚线。4090 剩 5.48 GiB，910B1 剩 40.56 GiB。前面两项几乎相同，预算差了 34.44 GiB，这个差额原样落在 KV 上，于是 KV 差了 7.4 倍。
    bars:
      gpu: {cap: 23.52, segs: [[权重, 15.54, A], [峰值增量, 0.62, B], [KV Cache, 5.48, C]], mark: [21.64, 0.92 的预算 21.64]}
      npu: {cap: 60.96, segs: [[权重, 15.32, A], [峰值增量, 0.2, B], [KV Cache, 40.56, C]], mark: [56.08, 0.92 的预算 56.08]}
    cap: ["4090 5.48 GiB@C", "910B1 40.56 GiB@C"]
  - text: KV 划完之后才轮到图捕获：4090 0.23 GiB，910B1 0.68 GiB。
    bars:
      gpu: {cap: 23.52, segs: [[权重, 15.54, A], [峰值增量, 0.62, B], [KV Cache, 5.48, C], [图捕获, 0.23, D, hatch]], mark: [21.64, 0.92 的预算 21.64]}
      npu: {cap: 60.96, segs: [[权重, 15.32, A], [峰值增量, 0.2, B], [KV Cache, 40.56, C], [图捕获, 0.68, D, hatch]], mark: [56.08, 0.92 的预算 56.08]}
    cap: ["4090 5.48 GiB@C", "910B1 40.56 GiB@C"]
  - text: 换算成 token：每个 token 的 KV 是 144 KiB，两边一样（36 层 × 8 个 KV 头 × 128 × K 和 V × 2 字节）。4090 装得下 39,920 个 token，910B1 装得下 295,296 个。后面几节都在这个容量差上。
    bars:
      gpu: {cap: 23.52, segs: [[权重, 15.54, A], [峰值增量, 0.62, B], [KV Cache, 5.48, C], [图捕获, 0.23, D, hatch]], mark: [21.64, 0.92 的预算 21.64], note: "39,920 token，同时放得下 1.2 条满长度请求"}
      npu: {cap: 60.96, segs: [[权重, 15.32, A], [峰值增量, 0.2, B], [KV Cache, 40.56, C], [图捕获, 0.68, D, hatch]], mark: [56.08, 0.92 的预算 56.08], note: "295,296 token，同时放得下 9.0 条满长度请求"}
    cap: ["4090 39,920 token@C", "910B1 295,296 token@C"]
