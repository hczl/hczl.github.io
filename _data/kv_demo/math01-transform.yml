# 3Blue1Brown 风格二维基向量线性组合、外积降维、逆矩阵与矩阵复合连续几何动画。
title: 观察向量 x 怎样由基向量线性组合而成，矩阵的列怎样决定空间网格的新落点，以及外积降维、逆矩阵还原和矩阵相乘顺序不可交换的原因（可拖动金色圆点改变输入向量 x）。
config:
  mode: basis2d
  hint: 拖动金色圆点可把输入向量 x 移到平面任意位置
  scrub_label: 变换进度 t
  reset_label: 重置 x
  legend:
    - {hex: "#fbbf24", text: "输入向量 x 与变换结果"}
    - {hex: "#60a5fa", text: "第一基向量 e₁ / 第 1 列 a₁"}
    - {hex: "#34d399", text: "第二基向量 e₂ / 第 2 列 a₂"}
    - {hex: "#38bdf8", dashed: true, text: "单位正方形变形后的有向面积 det"}
steps:
  - text: 标准坐标系（I）：向量 x = [2, 1]ᵀ 表示从原点出发，先沿第一基向量 e₁ = [1, 0]ᵀ（蓝）走 2 步，再沿第二基向量 e₂ = [0, 1]ᵀ（绿）走 1 步。两根基向量围出面积为 1 的单位正方形；拖动金色圆点可随时更换 x 的坐标。
    mat: [1, 0, 0, 1]
    mat_label: I
    t: 0
    vec_x: [2, 1]
  - text: 矩阵的列就是基向量的新落点：施加 A = [[2, −1], [1, 1]] 后，网格线保持平行且等距，e₁ 落到第 1 列 a₁ = [2, 1]ᵀ，e₂ 落到第 2 列 a₂ = [−1, 1]ᵀ。原本位于 2e₁ + 1e₂ 交点上的 x，自然跟着网格落到 2a₁ + 1a₂ = [3, 3]ᵀ，单位正方形被撑成面积 det A = 3 的平行四边形。
    mat: [2, -1, 1, 1]
    mat_label: A
    t: 1
    vec_x: [2, 1]
  - text: 逆矩阵还原空间（A⁻¹A = I）：因为两列不共线、面积 det A = 3 ≠ 0，二维平面没有丢失维度。先由 A 把 [2, 1]ᵀ 送到 [3, 3]ᵀ，再左乘逆矩阵 A⁻¹ = [[1/3, 1/3], [−1/3, 2/3]] 做反向变换，整张网格与所有向量都会严丝合缝地退回原位。
    t: 1
    vec_x: [2, 1]
    compose:
      first: [2, -1, 1, 1]
      second: [0.33333333, 0.33333333, -0.33333333, 0.66666667]
      first_label: A
      second_label: "A⁻¹"
      prod_label: "A⁻¹A"
  - text: 外积矩阵与秩 1 降维：M = uvᵀ = [1, 1]ᵀ[1, −1] = [[1, −1], [1, −1]] 的两列分别是 [1, 1]ᵀ 和 [−1, −1]ᵀ，完全叠在同一条 45° 直线上。变换后整张二维网格被压扁成一维直线，面积 det M = 0（秩为 1）；试着把金色圆点 x 沿着 x₁ − x₂ = 1 的方向来回拖动，会看到输出 Mx 始终停在 [1, 1]ᵀ 不动，无法再用逆矩阵还原。
    mat: [1, -1, 1, -1]
    mat_label: M
    t: 1
    vec_x: [2, 1]
  - text: 矩阵相乘 RB（先剪切 B，再旋转 R）：先按右边矩阵 B = [[1, 1], [0, 1]] 做水平剪切（x = [2, 1]ᵀ 变到 [3, 1]ᵀ），再按左边矩阵 R = [[0, −1], [1, 0]] 整体逆时针旋转 90°，复合矩阵为 RB = [[0, −1], [1, 1]]，向量最终停在 [−1, 3]ᵀ。
    t: 1
    vec_x: [2, 1]
    compose:
      first: [1, 1, 0, 1]
      second: [0, -1, 1, 0]
      second_rot90: true
      first_label: B
      second_label: R
      prod_label: RB
  - text: 调换顺序算 BR（先旋转 R，再剪切 B）：改成先逆时针旋转 90°（[2, 1]ᵀ 变到 [−1, 2]ᵀ），再做水平剪切，复合矩阵变成 BR = [[1, −1], [1, 0]]，同一个向量落到了 [1, 2]ᵀ。紫色虚线箭头保留了上一步 RBx = [−1, 3]ᵀ 的位置，直观对比出 RB ≠ BR。
    t: 1
    vec_x: [2, 1]
    compose:
      first: [0, -1, 1, 0]
      first_rot90: true
      second: [1, 1, 0, 1]
      first_label: R
      second_label: B
      prod_label: BR
      ghost_mat: [0, -1, 1, 1]
      ghost_label: RBx
