# 3Blue1Brown 风格点积、三种范数等距圈、余弦夹角、正交与外积投影矩阵（2D 压成 1D、3D 压成 2D）连续几何动画。
title: 观察三种范数的等距轮廓、点积与夹角余弦的关系，以及二维压到直线（P = qqᵀ）与三维压到 xy 平面（P = QQᵀ）的正交投影全过程。
config:
  mode: dotproj2d
  hint: 拖动金色圆点可同时改变向量 a 的方向和长度
  scrub_label: 变换进度 t
  reset_label: 重置状态
  legend:
    - {hex: "#fbbf24", text: "输入向量 a"}
    - {hex: "#60a5fa", text: "参考向量 b / 子空间基"}
    - {hex: "#34d399", text: "归一化向量 â / 正交投影 p"}
    - {hex: "#f87171", dashed: true, text: "垂直误差向量 a − p"}
steps:
  - text: 三种范数与归一化：对 a = [3, −4]ᵀ，L1 范数为 |3| + |−4| = 7，L2 长度为 √(9 + 16) = 5，L∞ 范数为 max(3, 4) = 4。画面标出了半径同为 3 的三条等范数轮廓（L1 菱形、L2 正圆、L∞ 正方形）；拖动下方滑块 t 从 0 到 1，可观察 a 除以自身 L2 长度缩回单位圆成为单位向量 â = [0.6, −0.8]ᵀ。
    vec_a: [3, -4]
    show_norms: true
    t: 0
  - text: 点积与余弦相似度：引入 b = [4, 2]ᵀ 并取 a = [1, 3]ᵀ，点积 aᵀb = 1×4 + 3×2 = 10，余弦相似度 cos θ = 0.71（夹角 45°）。试着把金色圆点 a 沿着原来的 45° 射线往外拉长或往里缩短：点积 aᵀb 会随长度成倍变化，而余弦相似度 cos θ 始终保持不变。
    vec_a: [1, 3]
    vec_b: [4, 2]
    show_angle: true
    t: 0
  - text: 正交与正负半平面：把 a 移到 [−1, 2]ᵀ，与 b = [4, 2]ᵀ 成 90° 直角，点积 4×(−1) + 2×2 = 0。过原点的白色虚线标出了与 b 垂直的分界线：分界线一侧夹角小于 90°（点积为正），另一侧夹角大于 90°（点积为负），恰好落在分界线上时两向量正交。
    vec_a: [-1, 2]
    vec_b: [4, 2]
    show_angle: true
    show_halfplane: true
    t: 0
  - text: 直线上的正交投影：把 a = [1, 3]ᵀ 往 b = [4, 2]ᵀ 所在的直线上作垂线，垂足落在 p = ((bᵀa)/(bᵀb)) b = 0.5×[4, 2]ᵀ = [2, 1]ᵀ（绿色箭头）。从 p 指向 a 的珊瑚红虚线误差向量 r = a − p = [−1, 2]ᵀ 与直线严格成 90° 直角，因此 p 就是直线上离 a 最近的点。
    vec_a: [1, 3]
    vec_b: [4, 2]
    show_proj: true
    t: 0
  - text: 外积投影矩阵 P = qqᵀ 把二维压成一维直线：记单位方向 q = b / ‖b‖₂，投影运算可写成 Pa = (qqᵀ)a = [[0.8, 0.4], [0.4, 0.2]]a。随着变换进度 t 从 0 推到 1，整张二维青色网格沿着垂直于 b 的方向压到 b 所在的直线上（秩为 1），任意点 a 都顺着垂线落到垂足 p；若再乘一次 P，直线上各点保持原位不动（P² = P）。
    vec_a: [1, 3]
    vec_b: [4, 2]
    show_proj: true
    t: 1
  - text: 推广到三维：往二维 xy 平面作正交投影。由两根标准正交单位向量 q₁ = [1, 0, 0]ᵀ 与 q₂ = [0, 1, 0]ᵀ 组成 3×2 矩阵 Q，撑起蓝色 xy 水平面。三维向量 a = [3, 4, 5]ᵀ 往该平面作垂线，垂足为 p = [3, 4, 0]ᵀ，珊瑚红误差向量 r = [0, 0, 5]ᵀ 沿 z 轴与整个 xy 平面垂直。此时 t = 0，青色三维网格保持立体原状，可拖动画面旋转视角。
    vec_a: [1, 3]
    vec_b: [4, 2]
    vec_3d: [3, 4, 5]
    show_proj3d: true
    hint: 拖动画面可旋转 3D 视角，拖动滑块 t 观察三维压扁成二维
    t: 0
  - text: 投影矩阵 P = QQᵀ 把三维压成二维平面：对 3×2 的 Q，反过来相乘得到 3×3 投影矩阵 QQᵀ = diag(1, 1, 0)（秩为 2，并非单位矩阵 I₃）。随着 t 从 0 推到 1，整个青色三维立方网格、悬浮样本点与向量 a = [3, 4, 5]ᵀ 沿 z 轴同步压扁，高度全部归零并落入 xy 平面，(QQᵀ)a = [3, 4, 0]ᵀ。
    vec_a: [1, 3]
    vec_b: [4, 2]
    vec_3d: [3, 4, 5]
    show_proj3d: true
    hint: 拖动画面可旋转 3D 视角，拖动滑块 t 观察三维压扁成二维
    t: 1
