# 第十二篇：投机解码的一步，k = 4。token 用代号表示，不是实测的切分；最后一步的接受比例是实测。
# 格子写法见 assets/kv-demo.js 开头（grids）。
title: 示意：一条请求的一步投机解码，每次猜 4 个 token。一格是一个 token，用代号表示。
config:
  grids:
    - {key: g0, label: 这条请求的输出, aria_name: 输出, columns: 11}
    - {key: g1, label: 目标模型这一步算出的 token（每个对齐到它要比较的那一格）, aria_name: 目标模型, columns: 11}
  legend:
    - {swatch: used, color: A, text: 已经输出的 token}
    - {swatch: cached, color: B, text: 草稿，还没验证}
    - {swatch: used, color: C, text: 目标模型自己选的 token}
    - {swatch: used, color: R, text: 丢掉的草稿}
  marks: {hit: 接受, re: 丢掉, eq: 相同, ne: 不同, skip: 不用, own: 目标给的}
  rows:
    - {key: adv, name: 这一步前进, optional: true}
    - {key: real, name: 实测, optional: true}
steps:
  - text: 上一步结束时，这条请求最后输出的 token 是 x。不开投机时，这一步目标模型只算 x 这一个位置，出 1 个 token。
    g0: ["前文@G", "前文@G", "前文@G", "前文@G", "x@A", ".", ".", ".", ".", ".", "."]
    g1: [".", ".", ".", ".", ".", ".", ".", ".", ".", ".", "."]
  - text: 起草。草稿方法根据到 x 为止的内容猜出后面 4 个 token d1 到 d4：ngram 从上下文里抄，EAGLE-3 和 MTP 用一个小网络，草稿模型自己往后生成 4 个。这些 token 还不算输出。
    g0: ["前文@G", "前文@G", "前文@G", "前文@G", "x@A", "~d1@B", "~d2@B", "~d3@B", "~d4@B", ".", "."]
    g1: [".", ".", ".", ".", ".", ".", ".", ".", ".", ".", "."]
  - text: 验证。目标模型这一步把 x、d1、d2、d3、d4 五个位置放在一次前向里算，每个位置都给出它自己会选的下一个 token：y1 是 x 后面该接的，y2 是 d1 后面该接的，依此类推。16 条请求同时这样走，这一步就是 80 个 token；不开投机时是 16 个。
    g0: ["前文@G", "前文@G", "前文@G", "前文@G", "x@A", "~d1@B", "~d2@B", "~d3@B", "~d4@B", ".", "."]
    g1: [".", ".", ".", ".", ".", "y1@C", "y2@C", "y3@C", "y4@C", "y5@C", "."]
  - text: 从左往右比。temperature 为 0 时，草稿和目标模型在同一位置选的 token 相同才算接受。d1 = y1、d2 = y2，接受；d3 和 y3 不同，从这里断开。d4 不再比较，它接在一个错的 token 后面，猜对了也没用，y4、y5 也是按错的前文算的，一起不要。
    g0: ["前文@G", "前文@G", "前文@G", "前文@G", "x@A", "d1@B:hit", "d2@B:hit", "d3@R:re", "d4@R:re", ".", "."]
    g1: [".", ".", ".", ".", ".", "y1@C:eq", "y2@C:eq", "y3@C:ne", "y4@G:skip", "y5@G:skip", "."]
  - text: 这一步输出 d1、d2 和 y3 三个 token。y3 是目标模型自己选的，所以就算 d1 就猜错，这一步也照样前进 1 个，和不开投机一样。下一步从 y3 后面重新起草。
    g0: ["前文@G", "前文@G", "前文@G", "前文@G", "x@A", "d1@A", "d2@A", "y3@C:own", ".", ".", "."]
    g1: [".", ".", ".", ".", ".", ".", ".", ".", ".", ".", "."]
    adv: 3 个 token：接受 2 个，再加目标模型给的 1 个
  - text: 换一种情况：4 个都猜对。y1 到 y4 都和草稿相同，y5 是 d4 后面该接的，也直接用上，这一步前进 5 个，是 k = 4 时的上限。
    g0: ["前文@G", "前文@G", "前文@G", "前文@G", "x@A", "d1@B:hit", "d2@B:hit", "d3@B:hit", "d4@B:hit", "y5@C:own", "."]
    g1: [".", ".", ".", ".", ".", "y1@C:eq", "y2@C:eq", "y3@C:eq", "y4@C:eq", "y5@C:own", "."]
    adv: 5 个 token：接受 4 个，再加 y5
  - text: 所以第 i 个草稿被接受，前提是前 i − 1 个都被接受，越往后的位置接受的比例越低。平均每步前进的 token 数等于 1 加上平均每次接受的草稿数。下面几节的数字都按这个口径。
    g0: ["前文@G", "前文@G", "前文@G", "前文@G", "x@A", "d1@B:hit", "d2@B:hit", "d3@B:hit", "d4@B:hit", "y5@C:own", "."]
    g1: [".", ".", ".", ".", ".", "y1@C:eq", "y2@C:eq", "y3@C:eq", "y4@C:eq", "y5@C:own", "."]
    adv: 最少 1 个，最多 k + 1 个
    real: Qwen3-0.6B 草稿、k = 4，四个位置被接受的比例 0.78 / 0.65 / 0.56 / 0.50，平均每步前进 3.49 个
