# 3Blue1Brown 风格三维到二维连续奇异值分解几何动画（M = [[3, 2, 2], [2, 3, -2]] = U Sigma V^T）。
title: 2×3 矩阵 M = U Σ Vᵀ 怎样把三维输入空间里的单位球一步步变成二维输出平面上的椭圆，以及截断到秩 1 时的几何坍缩（可按住画面拖动旋转三维视角）。
config:
  mode: svd3d
  hint: 按住画面拖动可旋转三维观察视角
  scrub_label: 分解阶段
  legend:
    - {hex: "#60a5fa", text: "第一奇异方向（v₁ → 5u₁）"}
    - {hex: "#34d399", text: "第二奇异方向（v₂ → 3u₂）"}
    - {hex: "#f87171", text: "零空间方向 v₃（被压为 0）"}
    - {hex: "#fbbf24", dashed: true, text: "秩 1 截断丢弃项（误差 σ₂ = 3）"}
steps:
  - text: 起点（三维输入空间 ℝ³）：青色经纬线表示半径为 1 的三维单位球，内部标出三条两两正交的右奇异向量 v₁（蓝）、v₂（绿）以及零空间方向 v₃（珊瑚红），底部灰格为目标二维输出平面。
    tau: 0
  - text: 第一步左乘 Vᵀ（3×3 正交矩阵）：整个三维单位球做刚体旋转，把倾斜的 v₁、v₂、v₃ 分别转到标准坐标轴 e₁、e₂、e₃ 上。正交变换只改朝向，球面上任意向量的长度保持 1 不变。
    tau: 1
  - text: 第二步左乘 Σ（2×3 奇异值矩阵）：沿第 1 轴拉长 σ₁ = 5 倍，沿第 2 轴拉长 σ₂ = 3 倍，同时沿第 3 轴乘 0，把三维球垂直压到二维平面上，形成长半轴 5、短半轴 3 的椭圆，零空间方向 v₃ 被压到原点。
    tau: 2
  - text: 第三步左乘 U（2×2 正交矩阵）：在二维输出平面内做正交旋转与镜像，长半轴落到 5u₁ = 5[1, 1]ᵀ/√2，短半轴落到 3u₂ = 3[1, −1]ᵀ/√2，至此完整拼出 M x = U Σ Vᵀ x。
    tau: 3
  - text: 截断到秩 1（只留 M₁ = 5u₁v₁ᵀ）：把次奇异值 σ₂ = 3 也压成 0，二维椭圆沿短轴塌成一条一维线段。灰色虚线保留了原椭圆轮廓，原椭圆边缘到线段的最大距离恰好就是被丢掉的短半轴长度 σ₂ = 3，直观对应 Eckart-Young 定理给出的最小逼近误差。
    tau: 4
