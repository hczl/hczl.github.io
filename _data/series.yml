# 系列定义。文章 front matter 写 series: <id> 和 series_order: <篇号> 即归入系列。
# outline 是全系列的计划篇目（按篇号顺序），用于在目录里显示“待发布”的篇目和总篇数；
# 列表里显示的是这里的短标题。调整计划时改这里，已发布文章的网址不受影响。
- id: rdma
  title: RDMA 入门
  description: 按一次 RDMA 通信的时间顺序，从打开网卡、创建资源、建链到一次传输和出错处理，逐步说明每个参数的作用。以 RC 和 RoCE v2 为主线。
  outline:
    - 一次 RDMA 通信的完整流程
    - InfiniBand、RoCE 与 iWARP
    - 初始化网卡
    - 创建资源：PD、CQ 与 QP
    - 内存注册
    - QP 状态机
    - 交换连接信息：socket 与 RDMA CM
    - 一次传输的完整过程
    - 操作语义与传输类型
    - 可靠性与出错处理
- id: math
  title: 大模型数学基础
  description: 先按学科复习线性代数、微积分、概率统计、信息论、最优化和数值计算，最后几篇再讲这些数学在大模型训练、推理和后训练中的用法。
  outline:
    - 向量与矩阵
    - 点积、范数与投影
    - 特征值与 SVD
    - 导数、偏导与梯度
    - 链式法则与矩阵求导
    - 概率基础
    - 常见分布
    - 期望、方差与估计
    - 最大似然估计
    - 熵、交叉熵与 KL 散度
    - 梯度下降
    - 浮点数与数值误差
    - 训练一步里用到的数学
    - 把注意力完整推一遍
    - 推理中的数学
    - 后训练中的数学
