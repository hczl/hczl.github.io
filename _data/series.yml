# 系列定义。文章 front matter 写 series: <id> 和 series_order: <篇号> 即归入系列。
# outline 是全系列的计划篇目（按篇号顺序），用于在目录里显示“待发布”的篇目和总篇数；
# 列表里显示的是这里的短标题。调整计划时改这里，已发布文章的网址不受影响。
- id: rdma
  title: RDMA 入门
  description: 按一次 RDMA 通信的时间顺序，从打开网卡、创建资源、建链到一次传输和出错处理，逐步说明每个参数的作用。以 RC 和 RoCE v2 为主线。
  outline:
    - 一次 RDMA 通信的完整流程
    - InfiniBand、RoCE 与 iWARP
    - 初始化网卡
    - 创建资源：PD、CQ 与 QP
    - 内存注册
    - QP 状态机
    - 交换连接信息：socket 与 RDMA CM
    - 一次传输的完整过程
    - 操作语义与传输类型
    - 可靠性与出错处理
- id: math
  title: 大模型数学基础
  description: 复习线性代数、微积分、概率统计、信息论、最优化和数值计算，每个概念都对应到它在大模型训练和推理中出现的位置。
  outline:
    - 训练一步里用到的数学
    - 向量与矩阵
    - 点积、范数与相似度
    - 特征值、SVD 与低秩
    - 导数、偏导与梯度
    - 链式法则与反向传播
    - 概率基础：语言模型是一个条件概率
    - 连续分布与高斯
    - softmax、温度与采样
    - 最大似然与交叉熵损失
    - 抽样、估计与评测
    - 熵、交叉熵与 KL 散度
    - 优化器：从梯度下降到 AdamW
    - 浮点数与训练稳定性
    - 量化的数学
    - 计算量与访存估算
    - 马尔可夫决策过程与策略梯度
    - PPO 与 DPO
    - 把注意力完整推一遍
