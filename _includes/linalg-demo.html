{%- comment -%}
3Blue1Brown 风格的线性变换与奇异值分解连续几何动画。用法：
{% include linalg-demo.html id="math03-eigen" caption="图注，可省略" %}
步骤数据在 _data/kv_demo/<id>.yml。外框与控制栏复用 kv-demo.css，JS 不可用时回退为文字步骤列表。
{%- endcomment -%}
{%- assign demo = site.data.kv_demo[include.id] -%}
<link rel="stylesheet" href="{{ '/assets/kv-demo.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/linalg-demo.css' | relative_url }}">
<figure class="kv-demo m3b-demo" id="m3b-demo-{{ include.id }}">
  <p class="kv-demo-title">{{ demo.title }}</p>
  <ol class="kv-demo-fallback">
    {%- for step in demo.steps %}
    <li>{{ step.text }}</li>
    {%- endfor %}
  </ol>
  <script type="application/json" class="m3b-demo-data">{{ demo | jsonify }}</script>
  {%- if include.caption %}
  <figcaption>{{ include.caption | markdownify | remove: '<p>' | remove: '</p>' | strip }}</figcaption>
  {%- endif %}
</figure>
<script src="{{ '/assets/linalg-demo.js' | relative_url }}" defer></script>
